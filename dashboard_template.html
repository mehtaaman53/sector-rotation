<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sector Rotation · The Trade Tribe</title>
<style>
:root{--bg:#e9eef8;--card:#fff;--line:#e6eaf2;--soft:#f4f6fb;--sel:#eef3ff;--ink:#1d2433;--mute:#6b7487;--blue:#2f6fe4;--up:#1f7ae0;--dn:#d23a5a;
--lead:#2f80ed;--imp:#8cbcf3;--weak:#f0a64a;--lag:#e35d84;--r:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px 8px}
.brand{font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}.brand span{color:var(--blue)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;color:var(--mute)}
.seg button.on{background:var(--sel);color:var(--blue);font-weight:600}
.seg button .c{color:#9aa3b5;font-weight:400;margin-left:3px}
.sp{flex:1}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font:inherit;color:var(--ink)}
.search{border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:200px;background:#fff}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute);white-space:nowrap}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:0 14px 8px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left{width:620px;flex:none}.right{flex:1;min-width:0}
.hd{padding:12px 16px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.hd h2{margin:0;font-size:15px}.hd .n{color:var(--mute)}
.scroll{overflow:auto;flex:1;min-height:0}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--soft);color:var(--mute);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:9px 8px;text-align:right;cursor:pointer;white-space:nowrap;z-index:1}
th:first-child,td:first-child{text-align:left;padding-left:16px}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr.g{cursor:pointer}tr.g:hover{background:#f8faff}tr.g.on{background:var(--sel)}
.gname{max-width:200px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
sup{font-size:9px;margin-left:2px}.pos{color:var(--up)}.neg{color:var(--dn)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#eef3ff;color:var(--blue);margin-left:5px;vertical-align:1px}
.badge.lo{background:#fdecef;color:var(--dn)}.badge.gr{background:#f1f3f7;color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute);margin:2px 4px 2px 0;white-space:nowrap}
.tag.lk{cursor:pointer}.tag.lk:hover{background:var(--sel);color:var(--blue)}
.ph{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff}
.q1{background:var(--lead)}.q2{background:var(--weak)}.q3{background:var(--lag)}.q4{background:var(--imp);color:#123}.q0{background:#ccd}
.info{padding:10px 16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.kv{display:flex;flex-direction:column}.kv b{font-size:15px}.kv span{color:var(--mute);font-size:11px}
.foot{display:flex;gap:14px;padding:6px 16px;color:var(--mute);font-size:11px;flex-wrap:wrap}
.foot button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;font-size:11px}
.th-cell{white-space:normal;text-align:left;max-width:260px}
.rrgwrap{display:flex;flex:1;min-height:0;gap:12px}
.rrgchart{flex:1;min-width:0;position:relative}
svg text{font:11px -apple-system,Segoe UI,sans-serif}
.rlist{width:300px;flex:none;overflow:auto;padding:10px 14px}
.rlist h4{margin:12px 0 6px;font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.rl div{padding:3px 4px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:4px;overflow:hidden}
.rl div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl div:hover,.rl div.pin{background:var(--sel)}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;display:flex;gap:6px;align-items:center;cursor:pointer}
.chip.off{opacity:.4}
.empty{padding:40px;text-align:center;color:var(--mute)}
.tip{position:absolute;pointer-events:none;background:#1d2433;color:#fff;padding:6px 9px;border-radius:8px;font-size:11px;display:none;white-space:nowrap;z-index:5}
.hint{color:var(--mute);font-size:11px;padding:4px 16px 8px}
@media (max-width:1200px){.left{width:520px}th,td{padding:8px 5px}}
@media (max-width:900px){html,body{height:auto}body{display:block}.main{flex-direction:column;flex:none}.card{max-height:none}.foot{position:static}.info{gap:10px}.left{width:auto;height:45vh}.right{height:auto;min-height:70vh}.rrgwrap{flex-direction:column}.rlist{width:auto}.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font:inherit;color:var(--ink)}
.search{width:130px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">Trade Tribe · <span>Sector Rotation</span></div>
  <div class="seg" id="kind"></div>
  <div class="seg" id="view"><button data-v="groups" class="on">Groups</button><button data-v="rrg">RRG</button></div>
  <div class="seg" id="tf"></div>
  <div class="seg" id="rtf" style="display:none"><button data-t="daily">Daily</button><button data-t="weekly" class="on">Weekly</button><button data-t="monthly">Monthly</button></div>
  <select id="bm" class="sel"><option value="ew">vs Equal-weight market</option><option value="n50">vs Nifty 50</option><option value="n500">vs Nifty 500</option><option value="mid150">vs Nifty Midcap 150</option><option value="sm250">vs Nifty Smallcap 250</option></select>
  <div class="seg" id="tail" style="display:none"><button data-n="5">Tail 5</button><button data-n="10" class="on">Tail 10</button></div>
  <div class="sp"></div>
  <input class="search" id="q" placeholder="Search group / stock…">
  <label class="chk"><input type="checkbox" id="small"> Small groups bhi</label>
</div>

<div class="main" id="groupsView">
  <div class="card left">
    <div class="hd"><h2 id="lt">Industries</h2><span class="n" id="lc"></span></div>
    <div class="scroll"><table id="gt"></table></div>
  </div>
  <div class="card right">
    <div class="hd"><h2 id="dn">—</h2><span class="n" id="dc"></span><span class="sp"></span><span id="dph"></span></div>
    <div class="info" id="dinfo"></div>
    <div class="scroll"><table id="st"></table></div>
  </div>
</div>

<div class="main" id="rrgView" style="display:none">
  <div class="card" style="flex:1">
    <div class="hd"><div class="chips" id="qchips"></div><span class="sp"></span><span class="n" id="rdate"></span></div>
    <div class="rrgwrap">
      <div class="rrgchart" id="rc"><svg id="rsvg" width="100%" height="100%"></svg><div class="tip" id="tip"></div></div>
      <div class="rlist" id="rlist"></div>
    </div>
    <div class="hint">Naam pe hover = raasta dikhega · Click = pin · Double-click = us group ke stocks kholo</div>
  </div>
</div>

<div class="foot" id="foot"></div>

<script>
const D=/*__DATA__*/null;
const KINDS=[["sector","Sector"],["industry","Industry"],["theme","Theme"]];
const TFS=["1D","1W","1M","3M","6M","1Y","YTD"];
const QN={1:"Leading",4:"Improving",2:"Weakening",3:"Lagging",0:"—"};
const QC={1:"var(--lead)",4:"var(--imp)",2:"var(--weak)",3:"var(--lag)",0:"#ccd"};
const DEFAULT_BM="ew";
const S={bm:DEFAULT_BM,kind:"industry",view:"groups",tf:"1W",rtf:"weekly",tail:10,small:false,q:"",sel:null,gsort:"rank",gdir:1,ssort:"tf",sdir:-1,pins:new Set(),hover:null,qoff:new Set()};
const STK=Object.fromEntries(D.stocks.map(s=>[s.s,s]));
const $=id=>document.getElementById(id);
const f=(v,d=2)=>v==null?"–":(+v).toFixed(d);
const sg=(v,d=2,suf="%")=>v==null?'<span>–</span>':`<span class="${v>=0?'pos':'neg'}">${v>0?'+':''}${(+v).toFixed(d)}${suf}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BNM={ew:"Equal-weight market",n50:"Nifty 50",n500:"Nifty 500",mid150:"Midcap 150",sm250:"Smallcap 250"};
const BN=()=>BNM[S.bm];const RR=g=>g.rrg[S.bm]||{};const RLv=(g,k)=>(g.rel[S.bm]||{})[k];
const LBL={sector:"Sectors",industry:"Industries",theme:"Themes"};

function load(){try{const h=new URLSearchParams(location.hash.slice(1));for(const k of["kind","view","tf","rtf","bm"])if(h.get(k))S[k]=h.get(k);if(h.get("g"))S.sel=h.get("g")}catch(e){}}
function save(){try{const h=new URLSearchParams({kind:S.kind,view:S.view,tf:S.tf,rtf:S.rtf,bm:S.bm});if(S.sel)h.set("g",S.sel);history.replaceState(null,"","#"+h)}catch(e){}}

function groups(){
  let g=D.groups[S.kind];
  if(!S.small)g=g.filter(x=>!x.small||x.name===S.sel);
  if(S.q){const q=S.q.toLowerCase();g=g.filter(x=>x.name.toLowerCase().includes(q)||x.m.some(s=>s.toLowerCase().startsWith(q)))}
  return g;
}
function gval(g,k){
  if(k==="rank")return g.rank?.[S.tf]??1e9; if(k==="name")return g.name;
  if(k==="ret")return g.ret[S.tf]??-1e9; if(k==="med")return g.med[S.tf]??-1e9; if(k==="rel")return RLv(g,S.tf)??-1e9;
  if(k==="b50")return g.b50; if(k==="hl")return g.h20-g.l20; if(k==="n")return g.n; return 0;
}
function seg(el,items,cur,cb){el.innerHTML=items.map(([v,l,c])=>`<button data-v="${v}" class="${v===cur?'on':''}">${l}${c!=null?`<span class="c">(${c})</span>`:''}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>cb(b.dataset.v));}

function renderTop(){
  seg($("kind"),KINDS.map(([k,l])=>[k,l,D.groups[k].length]),S.kind,v=>{S.kind=v;S.sel=null;S.pins.clear();render()});
  seg($("tf"),TFS.map(t=>[t,t]),S.tf,v=>{S.tf=v;render()});
  $("view").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.v===S.view);b.onclick=()=>{S.view=b.dataset.v;render()}});
  $("rtf").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",b.dataset.t===S.rtf);b.onclick=()=>{S.rtf=b.dataset.t;render()}});
  $("bm").value=S.bm;$("bm").onchange=e=>{S.bm=e.target.value;render()};
  $("tail").querySelectorAll("button").forEach(b=>{b.classList.toggle("on",+b.dataset.n===S.tail);b.onclick=()=>{S.tail=+b.dataset.n;render()}});
  const rr=S.view==="rrg";$("tf").style.display=rr?"none":"";$("rtf").style.display=rr?"":"none";$("tail").style.display=rr?"":"none";
  $("groupsView").style.display=rr?"none":"";$("rrgView").style.display=rr?"":"none";
}

function renderGroups(){
  const gs=groups().slice().sort((a,b)=>{const x=gval(a,S.gsort),y=gval(b,S.gsort);return (x<y?-1:x>y?1:0)*S.gdir});
  $("lt").textContent=LBL[S.kind];$("lc").textContent=gs.length;
  const H=[["name","Group"],["rank","Rank"],["med","Median "+S.tf],["rel","vs "+({ew:"Market",n50:"N50",n500:"N500",mid150:"Mid150",sm250:"SC250"})[S.bm]],["b50",">50 DMA"],["hl","20D H/L"]];
  let h="<tr>"+H.map(([k,l])=>`<th data-k="${k}">${l}${S.gsort===k?(S.gdir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  for(const g of gs){
    const rc=g.rchg?.[S.tf];const sup=rc?`<sup class="${rc>0?'pos':'neg'}">${rc>0?'+':'−'}${Math.abs(rc)}</sup>`:"";
    const sz=g.size==="Broad"||g.size==="Medium"?"":`<span class="badge gr">${g.n}</span>`;
    h+=`<tr class="g ${g.name===S.sel?'on':''}" data-n="${esc(g.name)}"><td><span class="gname" title="${esc(g.name)}">${esc(g.name)}</span>${sz}</td>
    <td>${g.rank?.[S.tf]??"–"}${sup}</td><td>${sg(g.med[S.tf])}</td><td>${sg(RLv(g,S.tf))}</td>
    <td>${f(g.b50,0)}%</td><td><span class="pos">${g.h20}</span>/<span class="neg">${g.l20}</span></td></tr>`;
  }
  $("gt").innerHTML=h||'<tr><td class="empty">Kuch nahi mila</td></tr>';
  $("gt").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(S.gsort===k)S.gdir*=-1;else{S.gsort=k;S.gdir=(k==="rank"||k==="name")?1:-1}renderGroups()});
  $("gt").querySelectorAll("tr.g").forEach(tr=>tr.onclick=()=>{S.sel=tr.dataset.n;renderGroups();renderDetail();save()});
  if(!S.sel&&gs.length){S.sel=gs[0].name;renderGroups();return}
  renderDetail();
}

function spark(g){
  const a=g.spark.g,b=g.spark[S.bm]||[];if(!a||a.length<2)return"";
  const W=260,H=54,all=a.concat(b).filter(v=>v!=null),mn=Math.min(...all),mx=Math.max(...all);
  const P=arr=>arr.map((v,i)=>`${(i/(arr.length-1)*W).toFixed(1)},${(H-(v-mn)/(mx-mn||1)*H).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" style="overflow:visible"><polyline points="${P(b)}" fill="none" stroke="#b8c0d0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polyline points="${P(a)}" fill="none" stroke="var(--blue)" stroke-width="2"/></svg>`;
}

function renderDetail(){
  const g=D.groups[S.kind].find(x=>x.name===S.sel);
  if(!g){$("dn").textContent="—";$("st").innerHTML="";$("dinfo").innerHTML="";return}
  $("dn").textContent=g.name;$("dc").textContent=`${g.n} stocks`+(g.sec?` · ${g.sec}`:"");
  const G=RR(g),ph=tf=>G[tf]?`<span class="ph q${G[tf].q}" title="Pichhla: ${QN[G[tf].pq]} · vs ${BN()}">${({daily:"D",weekly:"W",monthly:"M"})[tf]}: ${QN[G[tf].q]}</span> `:"";
  $("dph").innerHTML=ph("daily")+ph("weekly")+ph("monthly");
  const cm=Object.entries(g.capmix).filter(([,v])=>v).map(([k,v])=>`${k} ${v}`).join(" · ");
  const microW=g.micro>=0.7?'<span class="badge lo">Mostly Micro</span>':"";
  $("dinfo").innerHTML=`<div>${spark(g)}<div style="font-size:10px;color:var(--mute)"><span style="color:var(--blue)">━</span> Group (har stock barabar) &nbsp; <span style="color:#b8c0d0">┅</span> ${BN()} · 1 saal</div></div>
  <div class="kv"><b>${sg(g.med[S.tf])}</b><span>Median return ${S.tf}</span></div><div class="kv"><b>${sg(RLv(g,S.tf))}</b><span>vs ${BN()}</span></div><div class="kv"><b>${f(g.score?.[S.tf],0)}</b><span>Score (0–100)</span></div><div class="kv"><b>${f(g.part?.[S.tf],0)}%</b><span>Stocks jo market se aage</span></div>
  <div class="kv"><b>${f(g.b20,0)} / ${f(g.b50,0)} / ${f(g.b200,0)}%</b><span>Above 20/50/200 DMA</span></div>
  <div class="kv"><b>${f(g.nh,0)}%</b><span>52W high ke 10% andar</span></div>
  <div><span class="tag">Size: ${g.size}</span><span class="tag">Liquidity ₹${f(g.liq,1)} cr/din</span><span class="tag">${cm}</span>${microW}</div>`;
  const rows=g.m.map(s=>STK[s]).filter(Boolean);
  const SV={sym:x=>x.s,cap:x=>["Large","Mid","Small","Micro"].indexOf(x.cap),p:x=>x.p??-1,d1:x=>x.r["1D"]??-1e9,tf:x=>x.r[S.tf]??-1e9,hi:x=>x.hi??-1e9,rs:x=>x.rs??-1,vr:x=>x.vr??-1};
  rows.sort((a,b)=>{const x=SV[S.ssort](a),y=SV[S.ssort](b);return (x<y?-1:x>y?1:0)*S.sdir});
  const HS=[["sym","Symbol"],["cap","Cap"],["p","LTP"],["d1","1D"],["tf",S.tf],["hi","52W Hi"],["rs","RS"],["vr","Vol x"],["th","Themes"]];
  let h="<tr>"+HS.map(([k,l])=>`<th data-k="${k}">${l}${S.ssort===k?(S.sdir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  const other=S.kind==="theme"?"ind":"th";
  for(const x of rows){
    const b=(x.h20?'<span class="badge">20H</span>':"")+(x.l20?'<span class="badge lo">20L</span>':"");
    const chips=other==="ind"?`<span class="tag lk" data-k="industry" data-n="${esc(x.ind)}">${esc(x.ind)}</span>`:x.th.map(t=>`<span class="tag lk" data-k="theme" data-n="${esc(t)}">${esc(t)}</span>`).join("");
    h+=`<tr><td><a href="https://www.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(x.s)}" target="_blank" style="color:inherit;text-decoration:none;font-weight:600">${esc(x.s)}</a>${b}</td>
    <td><span class="tag" title="Benchmark: ${x.bm}">${x.cap}</span></td><td>${f(x.p)}</td><td>${sg(x.r["1D"])}</td><td>${sg(x.r[S.tf])}</td>
    <td>${x.hi==null?"–":f(x.hi,1)+"%"}</td><td>${x.rs??"–"}</td><td>${x.vr==null?"–":f(x.vr,1)+"×"}</td><td class="th-cell">${chips}</td></tr>`;
  }
  $("st").innerHTML=h;
  $("st").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k==="th")return;if(S.ssort===k)S.sdir*=-1;else{S.ssort=k;S.sdir=(k==="sym")?1:-1}renderDetail()});
  $("st").querySelectorAll(".tag.lk").forEach(t=>t.onclick=()=>{S.kind=t.dataset.k;S.sel=t.dataset.n;S.small=true;$("small").checked=true;render()});
  renderFoot(g,rows);
}

function renderFoot(g,rows){
  const n=D.groups[S.kind].length,shown=groups().length;
  $("foot").innerHTML=`<button id="cp">Copy to TradingView</button><button id="csv">CSV</button>
  <span>${g?esc(g.name)+" · "+rows.length+" stocks":""}</span><span class="sp"></span>
  <span>${shown} of ${n} ${LBL[S.kind].toLowerCase()}${S.small?"":" · small groups chhupe"}</span>
  <span>Data: ${D.asof}</span><span>Universe ${D.priced}/${D.universe}</span><span>Har group mein har stock barabar · Compare: ${BN()}</span><span>Not investment advice</span>`;
  $("cp").onclick=()=>{const t=rows.map(x=>"NSE:"+x.s).join(",");navigator.clipboard?.writeText(t).then(()=>{$("cp").textContent="Copied ✓";setTimeout(()=>$("cp").textContent="Copy to TradingView",1500)})};
  $("csv").onclick=()=>{const c=["symbol,cap,ltp,1d,"+S.tf+",from_52w_hi,rs,themes"].concat(rows.map(x=>[x.s,x.cap,x.p,x.r["1D"],x.r[S.tf],x.hi,x.rs,'"'+x.th.join("|")+'"'].join(","))).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download=(g?g.name:"group").replace(/\W+/g,"_")+".csv";a.click()};
}

/* ── RRG ─────────────────────────────── */
function rrgGroups(){return groups().filter(g=>RR(g)[S.rtf])}
function renderRRG(){
  const gs=rrgGroups(),dates=D.rrg_dates[S.rtf];
  $("rdate").textContent=`${({daily:"Daily",weekly:"Weekly",monthly:"Monthly"})[S.rtf]} · ${LBL[S.kind]} vs ${BN()} · ${dates[dates.length-1]||""}`;
  const cnt={1:0,4:0,2:0,3:0};gs.forEach(g=>cnt[RR(g)[S.rtf].q]=(cnt[RR(g)[S.rtf].q]||0)+1);
  $("qchips").innerHTML=[1,4,2,3].map(q=>`<span class="chip ${S.qoff.has(q)?'off':''}" data-q="${q}"><span class="dot" style="background:${QC[q]}"></span>${QN[q]} <b>${cnt[q]||0}</b></span>`).join("");
  $("qchips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const q=+c.dataset.q;S.qoff.has(q)?S.qoff.delete(q):S.qoff.add(q);renderRRG()});
  const vis=gs.filter(g=>!S.qoff.has(RR(g)[S.rtf].q));
  // side list
  let L="";for(const q of [1,4,2,3]){const arr=vis.filter(g=>RR(g)[S.rtf].q===q).sort((a,b)=>(RLv(b,"1M")??-99)-(RLv(a,"1M")??-99));if(!arr.length)continue;
    L+=`<h4><span class="dot" style="background:${QC[q]}"></span>${QN[q]} ${arr.length}</h4><div class="rl">`+arr.map(g=>{const r=RR(g)[S.rtf],n=r.x.length,dx=r.x[n-1]-r.x[Math.max(0,n-2)],dy=r.y[n-1]-r.y[Math.max(0,n-2)];
      const ang=Math.atan2(-dy,dx)*180/Math.PI;return `<div class="${S.pins.has(g.name)?'pin':''}" data-n="${esc(g.name)}"><span title="${esc(g.name)}">${esc(g.name)}</span><span style="display:inline-block;transform:rotate(${ang}deg);color:${QC[q]}">➜</span></div>`}).join("")+"</div>"}
  $("rlist").innerHTML=L||'<div class="empty">Koi group nahi</div>';
  $("rlist").querySelectorAll(".rl div").forEach(d=>{d.onmouseenter=()=>{S.hover=d.dataset.n;draw(vis)};d.onmouseleave=()=>{S.hover=null;draw(vis)};
    d.onclick=()=>{const n=d.dataset.n;S.pins.has(n)?S.pins.delete(n):S.pins.add(n);renderRRG()};d.ondblclick=()=>openGroup(d.dataset.n)});
  draw(vis);
}
function openGroup(n){S.view="groups";S.sel=n;render()}
function draw(vis){
  const svg=$("rsvg"),box=$("rc").getBoundingClientRect(),W=Math.max(300,box.width),H=Math.max(300,box.height),P=34;
  const tail=S.tail,focus=S.pins.size||S.hover;
  let xs=[],ys=[];vis.forEach(g=>{const r=RR(g)[S.rtf],k=Math.max(0,r.x.length-tail);xs.push(...r.x.slice(k).filter(v=>v!=null));ys.push(...r.y.slice(k).filter(v=>v!=null))});
  const span=(a,c)=>{const d=Math.max(Math.abs(Math.max(...a,c)-c),Math.abs(Math.min(...a,c)-c),1)*1.08;return[c-d,c+d]};
  const [x0,x1]=xs.length?span(xs,100):[95,105],[y0,y1]=ys.length?span(ys,100):[95,105];
  const X=v=>P+(v-x0)/(x1-x0)*(W-2*P),Y=v=>H-P-(v-y0)/(y1-y0)*(H-2*P);
  let s=`<rect x="${P}" y="${P}" width="${X(100)-P}" height="${Y(100)-P}" fill="#eef4fe"/><rect x="${X(100)}" y="${P}" width="${W-P-X(100)}" height="${Y(100)-P}" fill="#e8f1fd"/>
  <rect x="${P}" y="${Y(100)}" width="${X(100)-P}" height="${H-P-Y(100)}" fill="#fdeef3"/><rect x="${X(100)}" y="${Y(100)}" width="${W-P-X(100)}" height="${H-P-Y(100)}" fill="#fef5ea"/>
  <text x="${P+8}" y="${P+16}" fill="#5a8fd6" font-weight="600">Improving</text><text x="${W-P-8}" y="${P+16}" fill="#2f6fe4" text-anchor="end" font-weight="600">Leading</text>
  <text x="${P+8}" y="${H-P-8}" fill="#d0587e" font-weight="600">Lagging</text><text x="${W-P-8}" y="${H-P-8}" fill="#cf8730" text-anchor="end" font-weight="600">Weakening</text>
  <text x="${W/2}" y="${H-8}" fill="#6b7487" text-anchor="middle">RS-Ratio (Strength) →</text><text x="12" y="${H/2}" fill="#6b7487" transform="rotate(-90 12 ${H/2})" text-anchor="middle">RS-Momentum →</text>`;
  const order=vis.slice().sort((a,b)=>(focus&&(S.pins.has(a.name)||S.hover===a.name))-(focus&&(S.pins.has(b.name)||S.hover===b.name)));
  for(const g of order){
    const r=RR(g)[S.rtf],k=Math.max(0,r.x.length-tail),px=r.x.slice(k),py=r.y.slice(k),q=r.q,on=S.pins.has(g.name)||S.hover===g.name;
    const op=focus?(on?1:.12):.75,pts=px.map((v,i)=>`${X(v).toFixed(1)},${Y(py[i]).toFixed(1)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${QC[q]}" stroke-width="${on?2.4:1.3}" opacity="${op}" stroke-linejoin="round"/>`;
    if(on)px.forEach((v,i)=>{if(i<px.length-1)s+=`<circle cx="${X(v)}" cy="${Y(py[i])}" r="2.2" fill="${QC[q]}"/>`});
    const lx=X(px[px.length-1]),ly=Y(py[py.length-1]);
    s+=`<circle class="pt" data-n="${esc(g.name)}" cx="${lx}" cy="${ly}" r="${on?6:4.5}" fill="${QC[q]}" stroke="#fff" stroke-width="1.5" opacity="${focus?(on?1:.25):1}" style="cursor:pointer"/>`;
    if(on)s+=`<text x="${lx+8}" y="${ly-6}" font-weight="600" fill="#1d2433">${esc(g.name)}</text>`;
  }
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=s;
  const tip=$("tip");
  svg.querySelectorAll(".pt").forEach(c=>{const g=vis.find(x=>x.name===c.dataset.n),r=RR(g)[S.rtf];
    c.onmouseenter=e=>{tip.style.display="block";tip.innerHTML=`<b>${esc(g.name)}</b> · ${g.n} stocks<br>Ratio ${f(r.x[r.x.length-1])} · Mom ${f(r.y[r.y.length-1])}<br>${QN[r.pq]} → ${QN[r.q]} · 1M vs ${BN()} ${RLv(g,"1M")==null?"–":(RLv(g,"1M")>0?"+":"")+RLv(g,"1M")+"%"}`;
      tip.style.left=(+c.getAttribute("cx")/W*box.width+12)+"px";tip.style.top=(+c.getAttribute("cy")/H*box.height-10)+"px"};
    c.onmouseleave=()=>tip.style.display="none";
    c.onclick=()=>{S.pins.has(g.name)?S.pins.delete(g.name):S.pins.add(g.name);renderRRG()};c.ondblclick=()=>openGroup(g.name)});
}

function render(){renderTop();if(S.view==="rrg"){renderRRG();renderFoot(null,[])}else renderGroups();save()}
$("q").oninput=e=>{S.q=e.target.value.trim();render()};
$("small").onchange=e=>{S.small=e.target.checked;render()};
addEventListener("resize",()=>{if(S.view==="rrg")renderRRG()});
load();if(S.sel&&D.groups[S.kind].find(g=>g.name===S.sel&&g.small)){S.small=true;$("small").checked=true}
render();
</script>
</body>
