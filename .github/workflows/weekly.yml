name: Sector Rotation

on:
  schedule:
    - cron: "17 14 * * 1-5"  # Mon–Fri shaam 7:47 IST — sirf dashboard update (koi alert nahi)
    - cron: "17 3 * * 6"     # Shanivar subah 8:47 IST — dashboard + Telegram alert
  push:
    branches: [main]
    paths: [rotation.py, dashboard_template.html, data/groups.csv, .github/workflows/weekly.yml]
  workflow_dispatch:
    inputs:
      send_alert:
        description: "Telegram alert bhi bhejna hai?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sector-rotation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MD_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Fyers ka data (aapka PRIVATE market-data repo) — sirf is run ke andar padha jaata hai, commit kabhi nahi hota
      - name: Fyers data laao (market-data)
        if: env.MD_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: mehtaaman53/market-data
          token: ${{ secrets.MARKET_DATA_TOKEN }}
          path: market-data
          sparse-checkout: data/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sector rotation nikalo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SEND_ALERT: ${{ (github.event.schedule == '17 3 * * 6' || inputs.send_alert) && '1' || '0' }}
        run: python rotation.py
      - name: Dashboard save karo
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add docs data
          git commit -m "Update $(date +%F)" || echo "No changes"
          git pull --rebase
          git push
