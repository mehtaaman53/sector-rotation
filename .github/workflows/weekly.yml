name: Weekly Sector Rotation

on:
  schedule:
    - cron: "17 14 * * 1-5"  # Mon–Fri shaam 7:47 IST — sirf dashboard update (koi alert nahi)
    - cron: "17 3 * * 6"     # Shanivar subah 8:47 IST — dashboard + Telegram alert
  workflow_dispatch:
    inputs:
      send_alert:
        description: "Telegram alert bhi bhejna hai?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sector-rotation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sector rotation nikalo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SEND_ALERT: ${{ (github.event.schedule == '17 3 * * 6' || inputs.send_alert) && '1' || '0' }}
        run: python rotation.py
      - name: Dashboard save karo
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add docs data
          git commit -m "Update $(date +%F)" || echo "No changes"
          git pull --rebase
          git push
